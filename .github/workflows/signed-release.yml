name: 构建签名APK

on:
  push:
    branches:
      - 'ci/signed-release'
      - 'perf/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（Release 或 Debug）'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          SM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SM" --licenses 2>&1 | tail -3 || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5 || true
          ls "$ANDROID_HOME/platforms"

      - name: 还原签名密钥库
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          ls -l "$RUNNER_TEMP/signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing.jks" \
            -storepass "${{ secrets.SIGNING_KEYSTORE_PASSWORD }}" -alias "${{ secrets.SIGNING_KEY_ALIAS }}" >/dev/null
          echo "密钥库校验通过"

      - name: 构建签名APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/signing.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          BT="${{ github.event.inputs.build_type || 'Release' }}"
          ./gradlew ":app:assemble${BT}" --stacktrace 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: 校验签名
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -path "*build-tools*" -name apksigner -type f 2>/dev/null | sort | tail -1)
          echo "apksigner=$APKSIGNER"
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          echo "APK=$APK"
          "$APKSIGNER" verify --print-certs -v "$APK"

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-toolbox-signed
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 回传构建日志
        if: always()
        run: |
          tail -120 build-log.txt > build-log-tail.txt 2>/dev/null || echo "(无日志)" > build-log-tail.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B "ci-log-${GITHUB_RUN_ID}"
          git add -f build-log-tail.txt
          git commit -m "ci: 构建日志 run-${GITHUB_RUN_ID}" || exit 0
          git push -f origin "ci-log-${GITHUB_RUN_ID}"
